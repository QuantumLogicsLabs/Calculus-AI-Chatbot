name: CalcVoyager CI

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_real_tests:
        description: Run paid Groq acceptance and latency evaluations
        type: boolean
        default: false
      deploy_backend:
        description: Redeploy the existing SnapDeploy backend after checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-mock:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      USE_MOCK: 'True'
      GROQ_API_KEY: ''
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r aiService/requirements.txt
      - name: Run offline routes, persistence, context, cache and latency tests
        run: python -m pytest -q --junitxml=test-results/mock.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-results-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: error

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    env:
      REACT_APP_API_URL: http://127.0.0.1:8002
      REACT_APP_CHAT_URL: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Test streaming errors and chat UI
        working-directory: frontend
        run: npm test -- --runInBand
      - name: Build frontend
        working-directory: frontend
        # CRA promotes lint warnings to errors when CI=true.
        run: npm run build

  test-real:
    name: Groq acceptance evaluation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_real_tests)
    env:
      USE_MOCK: 'False'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONUTF8: '1'
      CALCVOYAGER_TEST_RESULTS_DIR: test-results/real
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require team Groq credentials
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Set the team-owned GROQ_API_KEY repository secret to run real evaluations."
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r aiService/requirements.txt
      - name: Evaluate real response quality and scope
        run: python -m aiService.tests.chatbot_tests
      - name: Evaluate real streaming first-token latency
        if: success() || failure()
        run: python -m aiService.tests.test_streaming_latency
      - name: Upload real evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-evaluation-results
          path: test-results/real/
          if-no-files-found: warn

  # Existing deployment is opt-in only; code/test changes must not redeploy
  # an operator-owned backend automatically. Parallel hosting is a later phase.
  deploy-backend:
    name: Deploy Backend (SnapDeploy, manual)
    runs-on: ubuntu-latest
    needs: [test-mock, frontend-build]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_backend && github.ref == 'refs/heads/main'
    env:
      SNAPDEPLOY_API_KEY: ${{ secrets.SNAPDEPLOY_API_KEY }}
      SNAPDEPLOY_APP_ID: ${{ secrets.SNAPDEPLOY_APP_ID }}
    steps:
      - name: Require SnapDeploy configuration
        run: |
          if [ -z "$SNAPDEPLOY_API_KEY" ] || [ -z "$SNAPDEPLOY_APP_ID" ]; then
            echo "::error::Set SNAPDEPLOY_API_KEY and SNAPDEPLOY_APP_ID before requesting deployment."
            exit 1
          fi
      - name: Trigger SnapDeploy redeploy
        run: |
          curl -f -X POST "https://api.snapdeploy.io/v1/apps/${SNAPDEPLOY_APP_ID}/deploy" \
            -H "Authorization: Bearer ${SNAPDEPLOY_API_KEY}" \
            -H "Content-Type: application/json"
